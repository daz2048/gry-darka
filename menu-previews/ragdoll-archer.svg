<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-labelledby="title desc">
  <title id="title">Ragdoll Archers</title>
  <desc id="desc">A physics archer aims across a dark arena, with an orange bow, dotted arrow path and upgrade panels.</desc>
  <defs>
    <linearGradient id="arena" x2="0" y2="1">
      <stop stop-color="#424242"/>
      <stop offset="1" stop-color="#303030"/>
    </linearGradient>
    <linearGradient id="bow" x2="1" y2="1">
      <stop stop-color="#ffd254"/>
      <stop offset="1" stop-color="#ed8612"/>
    </linearGradient>
  </defs>
  <rect width="640" height="320" fill="url(#arena)"/>
