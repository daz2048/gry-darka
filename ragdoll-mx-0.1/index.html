<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#404040">
  <title>Ragdoll MX 0.1</title>
  <link rel="icon" type="image/jpeg" href="favicon.jpeg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="unity-container">
    <canvas id="unity-canvas" aria-label="Ragdoll MX 0.1 game"></canvas>
    <div id="loading-cover">
      <div id="unity-loading-bar">
        <h1>RAGDOLL MX 0.1</h1>
        <div id="unity-progress-bar-empty" role="progressbar" aria-label="Game loading" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div id="unity-progress-bar-full"></div>
        </div>
        <p id="loading-status" role="status" aria-live="polite">Loading game...</p>
        <div id="local-server-help" hidden>
          <p>Run this command from the repository folder:</p>
          <pre>./scripts/game-server.sh</pre>
          <a id="local-game-link" href="http://localhost:8765/ragdoll-mx-0.1/">Open game on the local server</a>
        </div>
        <details>
          <summary>Loading diagnostics</summary>
          <pre id="loading-diagnostics"></pre>
        </details>
      </div>
    </div>
  </main>
  <script src="home-shortcut.js"></script>
  <script src="unity-loader.js"></script>
</body>
</html>
