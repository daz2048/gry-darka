<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#183f36">
  <meta name="description" content="Flappy Bird: maly ptak, wielka przygoda. Darmowa gra przegladarkowa Ekipy spod Lipy.">
  <title>Flappy Bird 0.2 | Ekipa spod Lipy</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="../player-links.css">
  <script defer src="../mario-0.3/vendor/phaser.min.js"></script>
  <script defer src="game.js"></script>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <a class="icon" href="../index.html" title="Menu gier (H / Esc)" aria-label="Menu gier">&#8962;</a>
      <div class="brand">FLAPPY <strong>BIRD</strong></div>
      <div class="tools">
        <button id="shop-open" class="icon" title="Sklep ze skorkami (B)" aria-label="Sklep ze skorkami" disabled>&#9733;</button>
        <button id="sound" class="icon" title="Dzwiek i muzyka (S)" aria-label="Dzwiek i muzyka" aria-pressed="true">&#9835;</button>
        <button id="pause" class="icon" title="Pauza (P)" aria-label="Pauza" aria-pressed="false" disabled>&#9208;</button>
      </div>
    </header>
    <section class="playfield" aria-label="Flappy Bird">
      <div id="game" role="img" aria-label="Pikselowy ptak przelatujacy pomiedzy zielonymi rurami"></div>
      <div class="hud"><span>WYNIK <b id="score">0</b></span><span>REKORD <b id="best">0</b></span></div>
      <div class="wallet" aria-label="Monety"><span aria-hidden="true">&#9670;</span> <b id="wallet">0</b></div>
      <div id="overlay" class="overlay">
        <div class="overlay-content">
          <span id="eyebrow" class="eyebrow">EKIPA SPOD LIPY</span>
          <h1 id="title">Flappy<br><em>Bird</em></h1>
          <p id="result">Maly ptak. Wielki swiat.</p>
          <button id="primary" class="primary">Lecimy <span aria-hidden="true">&#8594;</span></button>
          <a class="player-guide" href="../help.html#flappy" target="_blank" rel="noopener">Pomoc (nowa karta)</a>
        </div>
      </div>
      <span id="immortal" role="status" hidden>TURBO + NIESMIERTELNY</span>
      <div id="notice" role="status" hidden></div>
      <div id="fatal" role="alert" hidden>Nie udalo sie uruchomic gry. Odswiez strone lub <a href="../index.html">wroc do menu</a>.</div>
    </section>
    <footer><span>HAJNOWKA / PODLASIE</span><span>WERSJA 0.2</span></footer>
  </main>
  <dialog id="shop" aria-labelledby="shop-title">
    <header class="shop-header">
      <div><span class="eyebrow">PTASIA GARDEROBA</span><h2 id="shop-title">Sklep ze skorkami</h2></div>
      <button id="shop-close" class="icon" title="Zamknij sklep" aria-label="Zamknij sklep">&#215;</button>
    </header>
    <div class="shop-toolbar">
      <div class="shop-filters" aria-label="Filtr skorek">
        <button id="filter-all" aria-pressed="true">Wszystkie</button>
        <button id="filter-owned" aria-pressed="false">Moje</button>
      </div>
      <span class="shop-balance"><span aria-hidden="true">&#9670;</span> <b id="shop-wallet">0</b></span>
    </div>
    <div id="shop-grid" class="shop-grid"></div>
    <p id="shop-status" role="status"></p>
  </dialog>
</body>
</html>
